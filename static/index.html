<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot Control Tuner</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2430; --muted:#667085; --line:#e4e7ec; --ok:#12805c; --bad:#b42318; --acc:#2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1319; --card:#171c24; --text:#e8ecf2; --muted:#98a2b3; --line:#2a313c; --ok:#4ade80; --bad:#f87171; --acc:#60a5fa; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, Segoe UI, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin:14px 0; }
  button { background:var(--acc); color:#fff; border:0; border-radius:8px; padding:10px 18px; font-size:16px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .badge { font-size:12px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
  .badge.ok { color:var(--ok); border-color:var(--ok); } .badge.bad { color:var(--bad); border-color:var(--bad); }
  .safe { background:rgba(180,35,24,.1); border:1px solid var(--bad); color:var(--bad); border-radius:8px; padding:12px; font-weight:600; }
  canvas { width:100%; height:200px; display:block; }
  .metrics { color:var(--muted); font-size:14px; margin-top:6px; }
  pre { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px; overflow-x:auto; font-size:13px; }
  details { margin-top:8px; } summary { cursor:pointer; color:var(--muted); font-size:14px; }
  #mode { margin-left:auto; }
</style>
</head>
<body>
<main>
  <h1>Robot Control Tuner</h1>
  <p class="sub">An AI designs a motor controller, a sandbox tests it, and the AI keeps improving it.</p>
  <div class="card">
    <div class="row">
      <button id="go">Start tuning</button>
      <button id="safety" style="background:#b42318">Run safety test</button>
      <span id="goal" class="sub" style="margin:0"></span>
      <span id="mode" class="badge" hidden></span>
    </div>
  </div>
  <div id="log"></div>
  <div id="final"></div>
</main>
<script>
const COLORS = ['#94a3b8','#a78bfa','#f59e0b','#38bdf8','#fb7185','#34d399'];
const attempts = [];
const $ = id => document.getElementById(id);

function draw(canvas, series, target = 90) {
  const dpr = window.devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const c = canvas.getContext('2d'); c.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  const muted = css.getPropertyValue('--muted'), line = css.getPropertyValue('--line');
  const L = 40, R = 10, T = 10, B = 24;
  const maxY = Math.max(target * 1.4, ...series.flatMap(s => s.trace.map(p => p[1]))) * 1.03;
  const X = t => L + (w - L - R) * t / 4, Y = a => T + (h - T - B) * (1 - a / maxY);
  c.font = '11px system-ui'; c.fillStyle = muted; c.strokeStyle = line; c.lineWidth = 1;
  for (let t = 0; t <= 4; t++) { c.beginPath(); c.moveTo(X(t), T); c.lineTo(X(t), h - B); c.stroke(); c.fillText(t + ' s', X(t) - 8, h - 8); }
  for (const a of [0, 45, 90, 135]) { if (a > maxY) continue; c.fillText(a + '°', 4, Y(a) + 4); }
  c.fillStyle = 'rgba(34,197,94,.12)'; c.fillRect(L, Y(target * 1.02), w - L - R, Y(target * 0.98) - Y(target * 1.02));
  c.setLineDash([5, 4]); c.strokeStyle = '#22c55e'; c.beginPath(); c.moveTo(L, Y(target)); c.lineTo(w - R, Y(target)); c.stroke(); c.setLineDash([]);
  for (const s of series) {
    c.strokeStyle = s.color; c.lineWidth = s.width || 2; c.beginPath();
    s.trace.forEach((p, i) => i ? c.lineTo(X(p[0]), Y(p[1])) : c.moveTo(X(p[0]), Y(p[1])));
    c.stroke();
  }
}

function addAttempt(a) {
  attempts.push(a);
  const r = a.result, div = document.createElement('div'); div.className = 'card';
  const badge = r.status === 'ok' ? '<span class="badge ok">ran</span>' : r.status === 'stopped' ? '<span class="badge bad">stopped</span>' : '<span class="badge bad">error</span>';
  let body = '';
  if (r.status === 'ok') {
    const m = r.metrics;
    body = '<canvas></canvas><div class="metrics">Overshoot ' + m.overshoot_pct + '% · Settling time ' + (m.settling_time_s ?? 'never') + ' s · Final error ' + m.final_error_deg + '°</div>';
  } else if (r.status === 'stopped') {
    body = '<div class="safe">Run stopped safely. The AI’s code ran past the time limit (possible endless loop). The sandbox killed it and nothing else was affected.</div>';
  } else {
    body = '<div class="safe">The code failed: ' + r.error.replace(/</g, '&lt;') + '</div>';
  }
  div.innerHTML = '<div class="row"><strong>Attempt ' + a.round + '</strong>' + badge + '</div>' + body +
    '<details><summary>Show the AI’s code</summary><pre></pre></details>';
  div.querySelector('pre').textContent = a.code;
  $('log').appendChild(div);
  if (r.status === 'ok') draw(div.querySelector('canvas'), [{ trace: r.trace, color: COLORS[(a.round - 1) % COLORS.length] }]);
}

function showFinal() {
  const ok = attempts.filter(a => a.result.status === 'ok');
  if (!ok.length) { $('final').innerHTML = '<div class="card">No attempt ran successfully.</div>'; return; }
  const best = ok.reduce((x, y) => x.score <= y.score ? x : y);
  const series = ok.map(a => ({ trace: a.result.trace, color: a === best ? '#22c55e' : COLORS[(a.round - 1) % COLORS.length], width: a === best ? 3 : 1.5 }));
  const m = best.result.metrics;
  $('final').innerHTML = '<div class="card"><h2 style="margin-top:0">Result</h2><canvas></canvas>' +
    '<div class="metrics">Best: attempt ' + best.round + ' · overshoot ' + m.overshoot_pct + '% · settling time ' + m.settling_time_s + ' s. Green line = best attempt.</div>' +
    '<p><strong>Best controller found</strong></p><pre></pre></div>';
  $('final').querySelector('pre').textContent = best.code;
  draw($('final').querySelector('canvas'), series);
  $('final').scrollIntoView({ behavior: 'smooth' });
}

$('go').onclick = () => {
  $('go').disabled = true; $('log').innerHTML = ''; $('final').innerHTML = ''; attempts.length = 0;
  const es = new EventSource('/api/run');
  const stop = () => { es.close(); $('go').disabled = false; };
  es.addEventListener('start', e => {
    const d = JSON.parse(e.data); $('goal').textContent = d.goal;
    const b = $('mode'); b.hidden = false; b.textContent = d.mode === 'mock' ? 'Demo mode (scripted, no AI)' : 'Live AI · ' + d.model;
  });
  es.addEventListener('attempt', e => addAttempt(JSON.parse(e.data)));
  es.addEventListener('done', () => { stop(); showFinal(); });
  const msg = e => { const d = JSON.parse(e.data); $('log').innerHTML = '<div class="card safe">' + d.message.replace(/</g, '&lt;') + '</div>'; stop(); };
  es.addEventListener('busy', msg); es.addEventListener('failed', msg);
  es.onerror = stop;
};
   $('safety').onclick = async () => {
     $('safety').disabled = true; $('go').disabled = true; $('final').innerHTML = '';
     $('log').innerHTML = '<div class="card">Safety test: sending a deliberately broken controller (an endless loop, written by us, not by the AI) into the sandbox. This takes about 10 seconds.</div>';
     try {
       const d = await (await fetch('/api/safety-test')).json();
       const div = document.createElement('div'); div.className = 'card';
       if (d.status === 'busy') {
         div.classList.add('safe'); div.textContent = d.message;
       } else {
         const stopped = d.result.status === 'stopped';
         div.innerHTML = '<div class="row"><strong>Safety test</strong><span class="badge bad">' + d.result.status + '</span></div>' +
           '<div class="safe"></div><details open><summary>The broken code we sent</summary><pre></pre></details>';
         div.querySelector('.safe').textContent = stopped
           ? 'Run stopped safely. The sandbox killed the endless loop at the time limit. Nothing else was affected.'
           : 'Unexpected result: ' + (d.result.error || d.result.status);
         div.querySelector('pre').textContent = d.code;
       }
       $('log').innerHTML = ''; $('log').appendChild(div);
     } catch (e) {
       $('log').innerHTML = '<div class="card safe">The safety test could not run.</div>';
     }
     $('safety').disabled = false; $('go').disabled = false;
   };
</script>
</body>
</html>
